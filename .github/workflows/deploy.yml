name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            cd /home/ubuntu/embrowerment

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Web..."
            cd web
            npm install
            npm run build

            echo "Building Admin..."
            cd ../admin
            npm install
            npm run build

            echo "Updating Server..."
            cd ../server
            npm install --omit=dev

            echo "Restarting backend..."
            pm2 restart winkbrow-server || pm2 start npm --name "winkbrow-server" -- start

            pm2 save

            echo "Deployment completed!"